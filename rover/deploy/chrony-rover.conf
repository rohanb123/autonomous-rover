# Pi side of doc 00 section 4 clock sync: the GX10 is the LAN's only time source.
# Installed by setup_pi.sh as /etc/chrony/conf.d/marsnet.conf.
server 192.168.50.10 iburst minpoll 4 maxpoll 6
# The Pi has no RTC, so it boots with a stale clock: step freely for the first 3 updates
# instead of slewing for minutes while events.jsonl gets out-of-order timestamps.
makestep 1 3
