[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rover"
version = "0.1.0"
description = "Rover runtime on the Pi: WS :8765 /rover, motion, station capture, safety"
requires-python = ">=3.11"
dependencies = [
  "marsrover-shared",
  "websockets>=12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Hardware-only deps: install on the Pi with `pip install -e "rover[pi]"`. Mocks and tests don't need them.
pi = [
  "gpiozero>=2",
  "lgpio>=0.2",
  "smbus2>=0.4",
  # UNVERIFIED: PCA9685 lib vs plain smbus2 on Pi 5 (docs/05 U-23), pick at H2
  "adafruit-circuitpython-pca9685>=3.4",
]

[tool.setuptools]
packages = ["rover"]
