# Mirror of docs/00-overview-and-contracts.md §3. Doc 00 wins if they disagree.
router:
  ssid: marsnet
  subnet: 192.168.50.0/24
  gateway: 192.168.50.1

hosts:
  gx10:   {ip: 192.168.50.10, link: ethernet}
  pi:     {ip: 192.168.50.20, link: wifi, hostname: rover.local}
  laptop: {ip: 192.168.50.30, link: wifi}

services:
  rover_ws:     {host: pi,     port: 8765,  path: /rover, proto: ws,   owner: P2}
  rover_http:   {host: pi,     port: 8080,  paths: [/snapshot.jpg, /stream.mjpg], proto: http, owner: P2}
  brain:        {host: gx10,   port: 8000,  paths: [/api/*, /ws/brain], proto: http+ws, owner: P4}
  vision:       {host: gx10,   port: 8100,  paths: [/score, /analyze, /health], proto: http, owner: P3}
  mapper:       {host: gx10,   port: 8200,  paths: [/ingest/*, /fuse/*, /files/*], proto: http, owner: P3}
  overhead:     {host: gx10,   port: 8300,  path: /pose, proto: ws,   owner: P2}
  spacetimedb:  {host: gx10,   port: 3000,  db: marsrover, proto: http+ws, owner: P4}
  ollama:       {host: gx10,   port: 11434, proto: http, owner: P3}
  dashboard:    {host: laptop, port: 5173,  proto: http, owner: P4}

cors_origins:
  - http://192.168.50.30:5173
  - http://localhost:5173
