[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gx10-services"
version = "0.1.0"
description = "GX10 services: brain :8000, vision :8100, mapper :8200, overhead :8300"
requires-python = ">=3.11"
dependencies = [
  "marsrover-shared",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
brain = ["websockets>=12"]
# PyTorch is preinstalled on DGX OS; don't pin it here.
# UNVERIFIED: open_clip_torch / faster-whisper wheels on ARM64 + CUDA (docs/05 U-15)
vision = ["open_clip_torch>=2.24", "scikit-learn>=1.4", "joblib>=1.3", "pillow>=10", "opencv-python-headless>=4.9"]
voice = ["faster-whisper>=1.0"]
mapper = ["pillow>=10", "opencv-python-headless>=4.9"]
overhead = ["websockets>=12", "opencv-contrib-python-headless>=4.9"]   # needs cv2.aruco
ml = ["open_clip_torch>=2.24", "scikit-learn>=1.4", "joblib>=1.3", "pandas>=2", "pillow>=10"]
all = ["gx10-services[brain,vision,voice,mapper,overhead,ml]"]

[tool.setuptools]
packages = ["brain", "brain.voice", "vision", "mapper", "overhead"]
